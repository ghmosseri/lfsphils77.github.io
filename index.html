<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>League of Filipino Students</title>


<style>

    /* ========================================
       FONTS
    ======================================== */

    @font-face {
        font-family: "Inktera";
        src:
            url("LFSphils77-fonts/inktera-demo/InkteraDemo.otf")
            format("opentype");

        font-weight: bold;
        font-style: normal;
    }


    @font-face {
        font-family: "Masonries";
        src:
            url("LFSphils77-fonts/masonries-sans/MasonriesSans-BoldItalic.otf")
            format("opentype");

        font-weight: bold;
        font-style: italic;
    }


    @font-face {
        font-family: "Masonries";
        src:
            url("LFSphils77-fonts/masonries-sans/MasonriesSans-ExtraBold.otf")
            format("opentype");

        font-weight: 800;
        font-style: normal;
    }


    /* ========================================
       GENERAL
    ======================================== */

    * {
        box-sizing: border-box;
    }


    html,
    body {

        width: 100%;
        height: 100%;

        margin: 0;
    }


    body {

        display: flex;

        justify-content: center;
        align-items: center;

        background-image:
            url(
                "LFSphils77-media_assets/LFS-landing-backdrop.jpeg"
            );

        background-size: cover;

        background-position: center;

        background-repeat: no-repeat;

        overflow: hidden;
    }


    /* ========================================
       MAIN CONTAINER
    ======================================== */

    .container {

        width: 100%;

        padding: 30px;

        text-align: center;

        transform: translateY(30px);
    }


    /* ========================================
       MAIN TITLE
    ======================================== */

    h1 {

        margin: 0;

        font-family:
            "Inktera",
            sans-serif;

        font-size:
            clamp(
                60px,
                12vw,
                181.33px
            );

        font-weight: bold;

        line-height: 0.9;

        color: #ffbc10;
    }


    /* ========================================
       SUBTITLE
    ======================================== */

    h3 {

        margin:
            20px 0 0;

        font-family:
            "Masonries",
            sans-serif;

        font-size:
            clamp(
                35px,
                7vw,
                99.8px
            );

        font-weight: bold;

        font-style: italic;

        line-height: 0.9;

        color:
            rgba(
                255,
                188,
                16,
                0.768
            );
    }


    /* ========================================
       VIDEO TEXT CONTAINER
    ======================================== */

    .video-text {

        width: 100%;

        margin-top: 25px;

        display: flex;

        justify-content: center;

        align-items: center;
    }


    #videoTextCanvas {

        display: block;

        width: 100%;

        max-width: 1600px;

        height: auto;
    }


    /*
        The actual video is invisible.

        JavaScript uses it as the moving
        source for the canvas.
    */

    #paxSilicaVideo {

        position: absolute;

        width: 1px;
        height: 1px;

        opacity: 0;

        pointer-events: none;
    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

        .container {

            padding: 15px;
        }

    }

</style>

</head><body><main class="container">


    <h1>
        League of Filipino Students
    </h1>


    <h3>
        Youth Take To The Streets.
    </h3>


    <div class="video-text">

        <canvas
            id="videoTextCanvas"
        ></canvas>


        <video
            id="paxSilicaVideo"

            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >

            <source
                src="LFSphils77-media_assets/LFS-overlaytext-vid.mp4"
                type="video/mp4"
            >

        </video>

    </div>


</main>


<script>

    /* ========================================
       ELEMENTS
    ======================================== */

    const video =
        document.getElementById(
            "paxSilicaVideo"
        );


    const canvas =
        document.getElementById(
            "videoTextCanvas"
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    const text =
        "Shut Down Pax Silica!";


    /* ========================================
       CANVAS RESIZING
    ======================================== */

    function resizeCanvas() {

        const container =
            document.querySelector(
                ".video-text"
            );


        const width =
            container.clientWidth;


        const height =
            Math.max(
                130,
                width * 0.20
            );


        const pixelRatio =
            window.devicePixelRatio || 1;


        canvas.width =
            width * pixelRatio;


        canvas.height =
            height * pixelRatio;


        canvas.style.width =
            width + "px";


        canvas.style.height =
            height + "px";


        ctx.setTransform(
            pixelRatio,
            0,
            0,
            pixelRatio,
            0,
            0
        );
    }


    /* ========================================
       DRAW VIDEO THROUGH TEXT
    ======================================== */

    function drawVideoText() {

        const width =
            canvas.clientWidth;


        const height =
            canvas.clientHeight;


        if (
            width === 0 ||
            height === 0
        ) {

            requestAnimationFrame(
                drawVideoText
            );

            return;
        }


        /*
            Clear previous frame.
        */

        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        /*
            Determine responsive font size.
        */

        let fontSize =
            Math.min(
                width * 0.105,
                134.59
            );


        /*
            Make sure the font has loaded.
        */

        ctx.font =
            `800 ${fontSize}px "Masonries"`;


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        /*
            --------------------------------
            CREATE TEXT MASK
            --------------------------------
        */

        ctx.save();


        ctx.beginPath();


        ctx.fillText(
            text,
            width / 2,
            height / 2
        );


        /*
            Everything drawn after
            this point is restricted
            to the text shape.
        */

        ctx.clip();


        /*
            --------------------------------
            DRAW VIDEO
            --------------------------------
        */

        if (
            video.readyState >= 2 &&
            video.videoWidth > 0
        ) {

            const videoWidth =
                video.videoWidth;


            const videoHeight =
                video.videoHeight;


            const videoRatio =
                videoWidth /
                videoHeight;


            const canvasRatio =
                width /
                height;


            let drawWidth;
            let drawHeight;


            /*
                "Cover" behavior.

                The video fills the entire
                text area without distortion.
            */

            if (
                videoRatio >
                canvasRatio
            ) {

                drawHeight =
                    height;

                drawWidth =
                    height *
                    videoRatio;

            } else {

                drawWidth =
                    width;

                drawHeight =
                    width /
                    videoRatio;
            }


            const x =
                (
                    width -
                    drawWidth
                ) / 2;


            const y =
                (
                    height -
                    drawHeight
                ) / 2;


            ctx.drawImage(
                video,
                x,
                y,
                drawWidth,
                drawHeight
            );

        }


        ctx.restore();


        /*
            Continue with the next
            animation frame.
        */

        requestAnimationFrame(
            drawVideoText
        );
    }


    /* ========================================
       WAIT FOR FONTS
    ======================================== */

    document.fonts.ready.then(
        function () {

            resizeCanvas();

            drawVideoText();

        }
    );


    /* ========================================
       RESIZE
    ======================================== */

    window.addEventListener(
        "resize",
        resizeCanvas
    );


    /* ========================================
       START VIDEO
    ======================================== */

    video.play().catch(
        function () {

            console.log(
                "Autoplay was blocked."
            );

        }
    );

</script>

</body></html>
