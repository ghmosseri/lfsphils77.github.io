<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>League of Filipino Students</title>
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="./styles.css">
<style>
.hero-video{height:clamp(440px,82vh,940px)}
.panel{position:relative;z-index:1;text-align:center;min-height:90vh;margin-top:calc(-1*clamp(90px,18vh,200px));
  padding:clamp(100px,18vh,200px) 24px 90px;overflow:hidden;background-color:#800000;background-image:var(--redbg);
  -webkit-mask-image:linear-gradient(transparent,#000 clamp(90px,18vh,200px));mask-image:linear-gradient(transparent,#000 clamp(90px,18vh,200px))}
.panel::before{content:"";position:absolute;inset:-15%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 30% 30%,rgba(235,40,46,.35),transparent 40%),radial-gradient(circle at 75% 70%,rgba(163,0,0,.6),transparent 45%);animation:blob 22s ease-in-out infinite alternate}
@keyframes blob{from{transform:translate3d(-4%,-3%,0) scale(1)}to{transform:translate3d(4%,3%,0) scale(1.12)}}
.inner{position:relative;z-index:3;max-width:1500px;margin:0 auto}
h1{margin:0;font-family:"Inktera",Helvetica,sans-serif;font-weight:700;font-size:clamp(48px,11vw,170px);line-height:.9;color:var(--title)}
h3{margin:.4em 0 0;font-family:"Masonries",Helvetica,sans-serif;font-weight:700;font-style:italic;font-size:clamp(26px,6vw,92px);line-height:.95;color:var(--title)}
.callout{margin:clamp(18px,4vw,44px) 0 0;font-family:"Masonries",Helvetica,Arial,sans-serif;font-weight:800;font-size:9vw;line-height:1.45;color:var(--gold);-webkit-text-stroke:.045em var(--gold);paint-order:stroke fill}
.callout span{display:block;width:max-content;margin:0 auto;transform:scale(1.18,1.65)}
.bang{display:inline-block;position:relative;width:.27em;height:.78em;margin-left:.07em;vertical-align:baseline;filter:drop-shadow(.05em .015em 0 #3d0000)}
.bang::before{content:"";position:absolute;left:0;right:0;top:0;height:.52em;background:var(--gold);clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);border-radius:.05em .05em 0 0}
.bang::after{content:"";position:absolute;left:.035em;bottom:0;width:.2em;height:.2em;border-radius:50%;background:var(--gold)}
.bang{display:inline-block;width:.3em;height:.78em;margin-left:.1em;overflow:visible;vertical-align:baseline}
.tagline{font-family:"Masonries Thin",Helvetica,sans-serif;font-weight:100;font-size:clamp(1.15rem,2.6vw,2.1rem);line-height:1.3;max-width:28em;margin:clamp(14px,2.5vw,28px) auto 0;color:var(--ink)}
</style>
</head>
<body id="top">

<section class="duo hero-video fade-in" aria-hidden="true">
  <video class="media" id="heroVideo" autoplay muted loop playsinline preload="auto">
    <source src="./LFSphils77-media_assets/LFS-overlaytext-vid.mp4" type="video/mp4">
  </video>
</section>

<main class="panel grain">
  <div class="inner">
    <h1 class="ext fade-down">League of Filipino Students</h1>
    <h3 class="ext fade-down">Youth Take To The Streets</h3>
    <h2 class="callout ext fade-down" id="callout" aria-label="Shut Down Pax Silica!"><span>Shut Down</span><span>Pax Silica<i class="bang" aria-hidden="true"></i></span></h2>
    <p class="tagline fade-down">Celebrating 49 years of fighting against US imperialism and plunder.</p>
  </div>
</main>

<button class="sound" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
<script src="./animations.js" defer></script>
</body>
</html>
