<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Become a Member | League of Filipino Students</title>
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="./styles.css">
<style>

.page{position:relative;min-height:100vh;overflow:hidden;background-color:#800000;background-image:var(--redbg)}
.wrap{position:relative;z-index:5;padding:calc(var(--safe) + 56px) 16px 90px;text-align:center}
.back{position:absolute;top:calc(var(--safe) + 16px);left:16px;z-index:6;color:var(--gold);text-decoration:none;font:600 .95rem "Nunito Sans",Helvetica,sans-serif;border:2px solid var(--gold);border-radius:999px;padding:8px 16px;background:rgba(74,7,8,.55)}
.back:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* ---- video backdrop + map ---- */
.stage{position:relative;margin:0 -16px;padding:34px 16px 20px}
.stage .duo{position:absolute;inset:0;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 72%,transparent)}
.stage .duo .media{filter:grayscale(1) contrast(1.2) brightness(.6)}
.mapbox{position:relative;z-index:2;margin:0 auto;width:min(100%,520px);width:min(100%,520px,calc(76svh*.708));animation:mapin 1.6s ease both}
@keyframes mapin{from{opacity:0;transform:scale(.97)}}
.land-svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 18px rgba(255,215,0,.18))}
.dots-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dots-svg g[style] circle{transform-box:fill-box;transform-origin:center}
.core{fill:#eb282e;stroke:#ffd9d6;stroke-width:1;animation:beat 1.2s ease-in-out var(--d) 25 backwards}
@keyframes beat{0%{transform:scale(1)}10%{transform:scale(1.6)}20%{transform:scale(1)}32%{transform:scale(1.4)}44%,100%{transform:scale(1)}}
.ring{fill:none;stroke:#eb282e;stroke-width:1.6;vector-effect:non-scaling-stroke;opacity:0;animation:echo 1.2s ease-out var(--d) 25 backwards}
.r2{animation-delay:calc(var(--d) + .22s)}
@keyframes echo{0%{transform:scale(1);opacity:.9}75%,100%{transform:scale(6.5);opacity:0}}
/* at 30s the pulses stop completely (plain red dots remain), then the line is drawn top to bottom */
.calm .core,.calm .ring{animation:none}
.calm .ring{display:none}
.link{stroke-dasharray:1;stroke-dashoffset:1}
.draw .link{animation:draw 4.5s ease-in-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* ---- title (same slit-fade as the File Repository slogan) ---- */
.title{margin:clamp(22px,4vw,44px) auto 0;max-width:1000px;font-family:"Inktera",Helvetica,sans-serif;font-weight:700;font-size:clamp(30px,7vw,100px);line-height:1;letter-spacing:.02em;color:var(--gold);text-shadow:var(--extrude)}
.w{display:inline-block;white-space:nowrap}
.split .l{display:inline-block;opacity:0;animation:slit .9s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(1.8s + var(--i)*45ms)}
@keyframes slit{0%{opacity:0;clip-path:inset(50% 0 50% 0);transform:translateY(-.18em)}55%{opacity:1}100%{opacity:1;clip-path:inset(-30% -30% -30% -30%);transform:none}}
/* ---- subtitle: rises while fading in ---- */
.sub{margin:.9em auto 0;max-width:34em;font-family:"Masonries Thin",Helvetica,sans-serif;font-weight:100;font-size:clamp(1.25rem,2.8vw,2.1rem);line-height:1.35;color:var(--ink);animation:rise 1.3s cubic-bezier(.22,1,.36,1) 3.4s both}
.sub u{text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:.2em}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
/* ---- embossed form box ---- */
.emboss{max-width:860px;margin:clamp(28px,5vw,56px) auto 0;padding:clamp(12px,2vw,22px);border-radius:22px;background-color:#800000;background-image:var(--redbg);
  box-shadow:inset 2px 2px 1px rgba(255,236,150,.45),inset -3px -4px 8px rgba(0,0,0,.5),6px 8px 0 #3d0000,0 24px 50px rgba(0,0,0,.45);animation:rise 1.3s cubic-bezier(.22,1,.36,1) 4.8s both}
.well{border-radius:12px;overflow:hidden;background:#4a0707;box-shadow:inset 3px 3px 8px rgba(0,0,0,.6),inset -1px -1px 0 rgba(255,236,150,.25);min-height:160px;position:relative}
.well::before{content:"Loading the sign-up form…";position:absolute;inset:0;display:grid;place-items:center;font:600 1rem "Nunito Sans",Helvetica,sans-serif;color:var(--ink)}
.well iframe{position:relative;display:block;width:100%;height:clamp(700px,92vh,1100px);border:0;background:#fff}
.alt{margin:1.1em 0 0;font:600 .95rem "Nunito Sans",Helvetica,sans-serif;color:var(--ink)}
.alt a{color:var(--gold)}
.open-form{display:inline-block;margin-top:1.4em;background:var(--gold);color:#800000;text-decoration:none;font:800 1.05rem "Masonries",Helvetica,sans-serif;border-radius:999px;padding:13px 26px;box-shadow:3px 4px 0 #3d0000}
@media(prefers-reduced-motion:reduce){.mapbox,.sub,.emboss{animation:none}.core,.ring{animation:none}.ring{display:none}.link{stroke-dashoffset:0}.split .l{animation:none;opacity:1}}

</style>
</head>
